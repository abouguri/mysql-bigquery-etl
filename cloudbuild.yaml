# Build and test only. Terraform is the single owner of deployment configuration.
substitutions:
  _REGION: us-central1
  _REPOSITORY: mysql-bigquery-etl
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--target', 'test', '-t', 'etl-test:$BUILD_ID', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['run', '--rm', 'etl-test:$BUILD_ID']
  - name: gcr.io/cloud-builders/docker
    args: ['build', '--target', 'runtime', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/worker:$BUILD_ID', '.']
images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/worker:$BUILD_ID'
