name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Static checks
        run: |
          ruff check --no-cache --select E9,F .
          bash -n scripts/deploy.sh
          docker compose config --quiet

      - name: Run tests
        run: |
          python -m pytest tests/ --maxfail=1 --disable-warnings -v

      - name: MySQL fixture integration
        run: make integration

      - name: Clean fixtures
        if: always()
        run: make clean-fixtures

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Terraform without cloud credentials
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/infra:/infra" -w /infra --entrypoint sh hashicorp/terraform:1.13.5 -c 'terraform fmt -check && terraform init -backend=false -lockfile=readonly && terraform validate'
